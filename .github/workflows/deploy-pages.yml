name: GitHub Pagesへ公開

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: pnpmを準備
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 必要な部品を準備
        run: pnpm install --frozen-lockfile

      - name: 公開用サイトを作成
        run: pnpm build:pages

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5

      - name: 公開用ファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
